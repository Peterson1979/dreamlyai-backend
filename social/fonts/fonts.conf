<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Explicitly discover fonts in the directory containing this file
    as well as standard Vercel serverless / Linux paths.
  -->
  <dir>.</dir>
  <dir>./social/fonts</dir>
  <dir>/var/task/social/fonts</dir>

  <!--
    Required for serverless environments where default cache
    directory is read-only. /tmp is guaranteed writable on Vercel.
  -->
  <cachedir>/tmp/fontconfig</cachedir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
