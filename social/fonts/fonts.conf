<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 
    Explicitly discover fonts in the directory containing this file.
    When FONTCONFIG_PATH is set to this directory at runtime, '.' 
    resolves to the bundled 'social/fonts' location.
  -->
  <dir>.</dir>

  <!-- 
    Required for serverless environments where the default cache 
    directory is read-only. /tmp is guaranteed writable on Vercel.
  -->
  <cachedir>/tmp/fontconfig</cachedir>
</fontconfig>
